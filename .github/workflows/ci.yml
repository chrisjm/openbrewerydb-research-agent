name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check obdb/ && uv run ruff format --check obdb/

      - name: Tests
        run: uv run pytest obdb/tests/ -v
