[project]
name = "openbrewerydb-research-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "truststore>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
